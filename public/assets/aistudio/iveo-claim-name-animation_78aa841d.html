<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iveo – Claim your name (animation)</title>
</head>
<body style="margin:0;padding:24px;font-family:system-ui,sans-serif;background:#fff">

<!-- ============ COPY FROM HERE ============ -->
<style>
  /* Everything is scoped to .iveo-claim so it can't affect the rest of your site. */
  .iveo-claim{
    --ic-bg:#f4f4f4;
    --ic-surface:#fff;
    --ic-border:#e4e4e4;
    --ic-text:#111;
    --ic-muted:#777;
    --ic-ok:#111;
    --ic-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;

    container-type:inline-size;
    box-sizing:border-box;
    width:100%;
    aspect-ratio:322/193;
    background:var(--ic-bg);
    border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3.6cqw;
    overflow:hidden;
    position:relative;
  }
  .iveo-claim *{box-sizing:border-box}

  .iveo-claim .ic-field{
    width:74%;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 4.5cqw;
    height:15cqw;
    background:var(--ic-surface);
    border:1px solid var(--ic-border);
    border-radius:3.6cqw;
    font-family:var(--ic-mono);
    font-size:5.2cqw;
    color:var(--ic-text);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:box-shadow .3s, border-color .3s;
  }
  .iveo-claim.is-typing .ic-field{
    border-color:#c9c9c9;
    box-shadow:0 0 0 1.2cqw rgba(0,0,0,.05);
  }
  .iveo-claim.is-done .ic-field{animation:ic-pop .45s ease}

  .iveo-claim .ic-text{white-space:nowrap;display:flex;align-items:center}
  .iveo-claim .ic-caret{width:1px;height:1.2em;margin-left:1px;background:var(--ic-text);opacity:0}
  .iveo-claim.is-typing .ic-caret{opacity:1;animation:ic-blink 1s steps(1) infinite}

  .iveo-claim .ic-status{width:5.6cqw;height:5.6cqw;position:relative;flex:none}
  .iveo-claim .ic-status svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .iveo-claim .ic-spin{opacity:0;transform-origin:50% 50%}
  .iveo-claim.is-checking .ic-spin{opacity:1;animation:ic-rot .7s linear infinite}
  .iveo-claim .ic-check path{
    stroke-dasharray:20;stroke-dashoffset:20;
    transition:stroke-dashoffset .4s cubic-bezier(.65,0,.35,1);
  }
  .iveo-claim.is-done .ic-check path{stroke-dashoffset:0}

  .iveo-claim .ic-label{
    font-size:4cqw;
    color:var(--ic-muted);
    height:1.4em;line-height:1.4em;
    opacity:0;transform:translateY(1cqw);
    transition:opacity .35s, transform .35s;
  }
  .iveo-claim.is-checking .ic-label,
  .iveo-claim.is-done .ic-label{opacity:1;transform:none}

  @keyframes ic-blink{50%{opacity:0}}
  @keyframes ic-rot{to{transform:rotate(360deg)}}
  @keyframes ic-pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}

  @media (prefers-reduced-motion:reduce){
    .iveo-claim *{animation:none!important;transition:none!important}
  }
</style>

<div class="iveo-claim" id="iveoClaim" role="img" aria-label="Typing a username and seeing that it is available on iveo">
  <div class="ic-field">
    <span class="ic-text"><span>iveo.site/</span><span class="ic-name"></span><span class="ic-caret"></span></span>
    <span class="ic-status" aria-hidden="true">
      <svg class="ic-spin" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 3a9 9 0 1 0 9 9"/>
      </svg>
      <svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="var(--ic-ok)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5 5L20 6.5"/>
      </svg>
    </span>
  </div>
  <div class="ic-label">Checking…</div>
</div>

<script>
(function(){
  var root = document.getElementById('iveoClaim');
  if(!root) return;
  var nameEl = root.querySelector('.ic-name');
  var label  = root.querySelector('.ic-label');
  var names  = ['maya','lena','devsharma'];   /* edit freely */
  var i = 0, running = false, timer;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function wait(ms){ return new Promise(function(r){ timer = setTimeout(r, ms); }); }
  function setState(c){ root.className = 'iveo-claim' + (c ? ' ' + c : ''); }

  async function type(txt){
    for(var k=1;k<=txt.length && running;k++){ nameEl.textContent = txt.slice(0,k); await wait(110 + Math.random()*70); }
  }
  async function erase(){
    while(nameEl.textContent.length && running){ nameEl.textContent = nameEl.textContent.slice(0,-1); await wait(45); }
  }

  async function loop(){
    if(running) return; running = true;
    while(running){
      var n = names[i++ % names.length];
      nameEl.textContent = '';
      setState('');                                              await wait(500);
      setState('is-typing');                                     await type(n);
      await wait(250);
      setState('is-checking'); label.textContent = 'Checking…';  await wait(900);
      setState('is-done');     label.textContent = 'Available';  await wait(2200);
      setState('is-typing');                                     await erase();
      await wait(250);
    }
  }
  function stop(){ running = false; clearTimeout(timer); }

  if(reduce){
    nameEl.textContent = names[0]; label.textContent = 'Available'; setState('is-done'); return;
  }
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(e){
      if(e[0].isIntersecting){ loop(); } else { stop(); }
    },{threshold:.35}).observe(root);
  } else { loop(); }
})();
</script>

</body>
</html>
