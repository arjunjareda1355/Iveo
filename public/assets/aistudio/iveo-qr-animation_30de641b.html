<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iveo – A QR code for every page (animation)</title>
</head>
<body style="margin:0;padding:24px;max-width:480px;font-family:system-ui,sans-serif;background:#fff">

<!-- ============ COPY FROM HERE ============ -->
<style>
  /* Everything is scoped to .iveo-qr so it can't affect the rest of your site. */
  .iveo-qr{
    --iq-bg:#f4f4f4;
    --iq-card:#fff;
    --iq-ink:#111;
    --iq-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;

    container-type:inline-size;
    box-sizing:border-box;
    width:100%;
    aspect-ratio:232/109;
    background:var(--iq-bg);
    border-radius:12px;
    overflow:hidden;
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .iveo-qr *{box-sizing:border-box}

  .iveo-qr .iq-card{
    width:37cqw;aspect-ratio:1;padding:3.4cqw;position:relative;overflow:hidden;
    background:var(--iq-card);border:1px solid #e6e6e6;border-radius:3.4cqw;
    box-shadow:0 .6cqw 2.4cqw rgba(0,0,0,.06);
  }
  .iveo-qr .iq-card.is-pulse{animation:iq-pulse .5s ease}
  .iveo-qr svg.iq-code{display:block;width:100%;height:100%}
  .iveo-qr .iq-code rect{
    fill:var(--iq-ink);
    transform-box:fill-box;transform-origin:center;transform:scale(0);
    transition:transform .3s cubic-bezier(.2,.9,.3,1.3);
  }
  .iveo-qr.is-built .iq-code rect{transform:scale(1);transition-delay:var(--d,0s)}

  /* scanning line */
  .iveo-qr .iq-scan{
    position:absolute;left:0;right:0;top:0;height:7cqw;pointer-events:none;opacity:0;
    background:linear-gradient(to bottom, rgba(17,17,17,0), rgba(17,17,17,.14) 60%, rgba(17,17,17,.55) 98%, rgba(17,17,17,.55));
    border-bottom:1px solid rgba(17,17,17,.55);
    transform:translateY(-100%);
  }
  .iveo-qr.is-scanning .iq-scan{animation:iq-scan 1.3s cubic-bezier(.5,0,.3,1) forwards}

  /* download pill */
  .iveo-qr .iq-pill{
    position:absolute;right:6cqw;bottom:5cqw;z-index:3;
    display:flex;align-items:center;gap:1.6cqw;
    height:7.4cqw;padding:0 3.2cqw;border-radius:4cqw;
    background:#111;color:#fff;font-family:var(--iq-mono);font-size:2.9cqw;
    box-shadow:0 1cqw 3cqw rgba(0,0,0,.2);
    opacity:0;transform:translateY(3cqw) scale(.95);
    transition:opacity .35s, transform .45s cubic-bezier(.2,.9,.3,1.2);
  }
  .iveo-qr.show-pill .iq-pill{opacity:1;transform:none}
  .iveo-qr .iq-pill svg{width:3.4cqw;height:3.4cqw}
  .iveo-qr .iq-pill .iq-done{display:none}
  .iveo-qr.is-saved .iq-pill .iq-dl{display:none}
  .iveo-qr.is-saved .iq-pill .iq-done{display:block}
  .iveo-qr.is-saving .iq-pill .iq-dl{animation:iq-bob .5s ease 2}
  .iveo-qr .iq-pill .iq-t2{display:none}
  .iveo-qr.is-saved .iq-pill .iq-t1{display:none}
  .iveo-qr.is-saved .iq-pill .iq-t2{display:inline}

  .iveo-qr.is-out .iq-card, .iveo-qr.is-out .iq-pill{opacity:0;transition:opacity .45s}

  @keyframes iq-scan{
    0%{transform:translateY(-100%);opacity:0}
    12%{opacity:1}
    88%{opacity:1}
    100%{transform:translateY(calc(37cqw - 6.8cqw + 7cqw - 7cqw));opacity:0}
  }
  @keyframes iq-pulse{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  @keyframes iq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.7cqw)}}
  @media (prefers-reduced-motion:reduce){
    .iveo-qr *{animation:none!important;transition:none!important}
  }
</style>

<div class="iveo-qr" id="iveoQr" role="img" aria-label="A QR code being generated, then downloaded as a PNG">
  <div class="iq-card" id="iqCard">
    <svg class="iq-code" id="iqCode" viewBox="0 0 21 21" shape-rendering="crispEdges" aria-hidden="true"></svg>
    <span class="iq-scan"></span>
  </div>
  <div class="iq-pill">
    <svg class="iq-dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    <svg class="iq-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    <span class="iq-t1">PNG</span><span class="iq-t2">Saved</span>
  </div>
</div>

<script>
(function(){
  var root = document.getElementById('iveoQr');
  if(!root) return;
  var svg = root.querySelector('#iqCode'), card = root.querySelector('#iqCard');
  var N = 21, NS = 'http://www.w3.org/2000/svg';
  var running = false, timer;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- decorative QR-style pattern (not a scannable code) ---- */
  function finder(x, y){
    var dx = x % 14, dy = y % 14, a = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));
    return a === 3 || a <= 1;                     /* ring + 3×3 centre */
  }
  function inFinderZone(x, y){
    return (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
  }
  var seed = 7;
  function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

  for(var y = 0; y < N; y++){
    for(var x = 0; x < N; x++){
      var dark = false, delay;
      if(inFinderZone(x, y)){
        var fx = x > 12 ? x - 14 : x, fy = y > 12 ? y - 14 : y;
        if(fx < 7 && fy < 7){
          var a = Math.max(Math.abs(fx - 3), Math.abs(fy - 3));
          dark = (a === 3 || a <= 1);
        }
        delay = (fx + fy) * 28;                    /* finders sweep in first */
      } else if(x === 6 || y === 6){
        dark = ((x + y) % 2 === 0); delay = 300 + rnd() * 500;   /* timing lines */
      } else {
        dark = rnd() > .52; delay = 350 + rnd() * 1000;
      }
      if(!dark) continue;
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', 1.02); r.setAttribute('height', 1.02);
      r.style.setProperty('--d', Math.round(delay) + 'ms');
      svg.appendChild(r);
    }
  }

  function wait(ms){ return new Promise(function(res){ timer = setTimeout(res, ms); }); }
  function reset(){
    ['is-built','is-scanning','show-pill','is-saving','is-saved','is-out'].forEach(function(c){ root.classList.remove(c); });
    card.classList.remove('is-pulse');
  }

  async function loop(){
    if(running) return; running = true;
    while(running){
      reset();                                         await wait(700);
      /* 1 — the code builds itself */
      root.classList.add('is-built');                  await wait(1900);
      /* 2 — scan sweep */
      root.classList.add('is-scanning');               await wait(1400);
      card.classList.add('is-pulse');
      /* 3 — download as PNG */
      root.classList.add('show-pill');                 await wait(900);
      root.classList.add('is-saving');                 await wait(1100);
      root.classList.remove('is-saving'); root.classList.add('is-saved');
      await wait(2200);
      root.classList.add('is-out');                    await wait(800);
    }
  }
  function stop(){ running = false; clearTimeout(timer); }

  if(reduce){ root.classList.add('is-built','show-pill'); return; }
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(e){
      if(e[0].isIntersecting){ loop(); } else { stop(); }
    },{threshold:.35}).observe(root);
  } else { loop(); }
})();
</script>

</body>
</html>
