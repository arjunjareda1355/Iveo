    <!-- Structured Data (JSON-LD): FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is iveo free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The free plan includes one page, unlimited links and all six vibes. Pro adds link scheduling, password-protected links, advanced analytics and contact collection."
            }
          },
          {
            "@type": "Question",
            "name": "Can I change my username later?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, from Settings. Your old address stops working when you change it, so update it anywhere you have shared it."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use my own domain?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Custom domains are on our roadmap. For now, every page lives at iveo.site/yourname."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a website to use iveo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. iveo works on its own. Many people use it as their only page, and others link to it from social profiles, email signatures and printed materials."
            }
          },
          {
            "@type": "Question",
            "name": "What does analytics show?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Page views, link clicks, click-through rate, top referrers and device types. We do not sell visitor data, and we do not collect visitor names or emails unless you add a signup block."
            }
          },
          {
            "@type": "Question",
            "name": "Can I collect emails from visitors?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. With Pro you can add a signup block for emails or phone numbers and export everything as a CSV file whenever you like."
            }
          },
          {
            "@type": "Question",
            "name": "What happens if I cancel Pro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your page stays online on the free plan. Pro-only blocks are hidden, not deleted, so they return if you upgrade again."
            }
          },
          {
            "@type": "Question",
            "name": "How do I get help?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Email help@iveo.site. We read every message and aim to reply within one to two business days."
            }
          }
        ]
      }
    </script>
    <!-- ═══════════════════════════════════════════════════════════════
         iveo Site Intro Styles: curtain wipe, logo tile & wordmark reveal
         ═══════════════════════════════════════════════════════════════ -->
    <style id="iveo-intro-css">
      #iveo-intro {
        --iv-bg: #fafafa;
        --iv-black: #060606;
        --iv-white: #fafafa;
        --iv-ease: cubic-bezier(.76, 0, .24, 1);
        --iv-out: cubic-bezier(.16, 1, .3, 1);
        --iv-spring: cubic-bezier(.34, 1.56, .64, 1);
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center;
        background: var(--iv-bg); overflow: hidden; will-change: transform;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #iveo-intro .iv-grid {
        position: absolute; inset: 0; opacity: 0;
        background-image:
          linear-gradient(to right, rgba(6,6,6,.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(6,6,6,.05) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(circle at center, #000 0, transparent 60%);
                mask-image: radial-gradient(circle at center, #000 0, transparent 60%);
        animation: iv-fade 1s .1s ease forwards;
      }

      /* black wipe that grows out of the logo tile */
      #iveo-intro .iv-wipe {
        position: absolute; inset: 0; background: var(--iv-black);
        clip-path: circle(0 at 50% 50%);
        animation: iv-wipe .55s .42s var(--iv-ease) forwards;
      }
      #iveo-intro .iv-wipe::after { /* faint light bloom inside the black */
        content: ""; position: absolute; left: 50%; top: 50%; width: min(90vw, 720px); aspect-ratio: 1;
        transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,255,255,.09), transparent 70%);
      }

      #iveo-intro .iv-stage { position: relative; display: grid; place-items: center; width: 100%; }
      #iveo-intro .iv-stage > * { grid-area: 1 / 1; }

      /* ── official logo tile ── */
      #iveo-intro .iv-tile {
        width: min(34vw, 150px); height: auto; overflow: hidden; border-radius: 27%;
        filter: drop-shadow(0 24px 40px rgba(0,0,0,.28));
        opacity: 0; transform: scale(.5);
        animation: iv-tile-in .45s .05s var(--iv-spring) forwards,
                   iv-tile-out .35s .62s var(--iv-ease) forwards;
      }
      #iveo-intro .iv-t-body {
        fill: #fff; transform-box: fill-box; transform-origin: 50% 100%;
        transform: scaleY(0); opacity: 0;
        animation: iv-grow .38s .15s var(--iv-out) forwards;
      }
      #iveo-intro .iv-t-fold { opacity: 0; animation: iv-fade .3s .32s ease forwards; }
      #iveo-intro .iv-t-dot {
        fill: #fff; transform: translateY(-420px); opacity: 0;
        animation: iv-drop .45s .25s var(--iv-spring) forwards;
      }

      /* ── official wordmark ── */
      #iveo-intro .iv-mark { width: min(72vw, 400px); height: auto; overflow: hidden; }
      #iveo-intro .iv-l {
        fill: var(--iv-white); transform: translateY(640px);
        animation: iv-letter .48s calc(.65s + var(--i) * .045s) var(--iv-out) forwards;
      }
      #iveo-intro .iv-l-dot {
        transform: translateY(-420px);
        animation: iv-drop .45s .82s var(--iv-spring) forwards;
      }
      #iveo-intro .iv-ping {
        fill: none; stroke: #fff; stroke-width: 5; opacity: 0;
        transform-box: fill-box; transform-origin: center;
        animation: iv-ping .55s .95s ease-out forwards;
      }

      /* tagline */
      #iveo-intro .iv-tag {
        position: absolute; left: 0; right: 0; top: calc(50% + min(24vw, 128px));
        display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .7em;
        font-size: clamp(10px, 2.9vw, 12px); letter-spacing: .34em; font-weight: 500;
        color: rgba(255,255,255,.58); text-transform: uppercase; padding: 0 20px;
      }
      #iveo-intro .iv-tag span {
        display: inline-block; opacity: 0; transform: translateY(12px); filter: blur(5px);
        animation: iv-rise .42s var(--iv-out) forwards;
      }
      #iveo-intro .iv-tag span:nth-child(1) { animation-delay: .86s; }
      #iveo-intro .iv-tag span:nth-child(2) { animation-delay: .93s; }
      #iveo-intro .iv-tag span:nth-child(3) { animation-delay: 1.00s; }

      /* progress (auto-contrast over light and dark) */
      #iveo-intro .iv-foot {
        color: #fff; mix-blend-mode: difference;
        position: absolute; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
        display: grid; justify-items: center; gap: 12px; opacity: 0; animation: iv-fade .6s .3s ease forwards;
      }
      #iveo-intro .iv-bar { width: min(52vw, 220px); height: 2px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; }
      #iveo-intro .iv-bar i { display: block; height: 100%; background: #fff; transform: scaleX(0); transform-origin: left; }
      #iveo-intro .iv-count { font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; font-variant-numeric: tabular-nums; opacity: .8; }

      /* curved lower edge revealed as the curtain lifts */
      #iveo-intro .iv-edge {
        position: absolute; left: -10%; right: -10%; top: calc(100% - 1px); height: 16vh; background: var(--iv-black);
        border-radius: 0 0 50% 50% / 0 0 100% 100%; pointer-events: none;
      }

      /* exit */
      #iveo-intro.is-leaving { animation: iv-curtain .52s var(--iv-ease) forwards; pointer-events: none; }
      #iveo-intro.is-leaving .iv-stage, #iveo-intro.is-leaving .iv-tag { animation: iv-stage-out .4s var(--iv-ease) forwards; }
      #iveo-intro.is-leaving .iv-foot { animation: iv-fade-out .18s ease forwards; }

      @keyframes iv-tile-in  { to { opacity: 1; transform: none } }
      @keyframes iv-tile-out { to { opacity: 0; transform: scale(.78) } }
      @keyframes iv-grow     { to { transform: none; opacity: 1 } }
      @keyframes iv-drop     { to { transform: none; opacity: 1 } }
      @keyframes iv-letter   { to { transform: none } }
      @keyframes iv-wipe     { to { clip-path: circle(120vmax at 50% 50%) } }
      @keyframes iv-ping     { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
      @keyframes iv-rise     { to { opacity: 1; transform: none; filter: blur(0) } }
      @keyframes iv-fade     { to { opacity: 1 } }
      @keyframes iv-fade-out { to { opacity: 0 } }
      @keyframes iv-curtain  { to { transform: translateY(-100%) } }
      @keyframes iv-stage-out{ to { transform: translateY(-50px) scale(.96); opacity: 0 } }

      html.iveo-intro-active, html.iveo-intro-active body { overflow: hidden !important; }

      @media (prefers-reduced-motion: reduce) {
        #iveo-intro, #iveo-intro * { animation-duration: .01s !important; animation-delay: 0s !important; }
        #iveo-intro.is-leaving { animation: iv-fade-out .4s ease forwards !important; }
        #iveo-intro .iv-tile { display: none; }
      }
    </style>
    <noscript><style>#iveo-intro{display:none!important}</style></noscript>

    <!-- Early check: skip on user pages and skip instantly if already seen (no flash). -->
    <script>
      (function () {
        try {
          var SITE_ROUTES = {
            '': 1, 'pricing': 1, 'legal': 1, 'privacy': 1, 'terms': 1,
            'discover': 1, 'seo': 1,
            'login': 1, 'signup': 1, 'sso-callback': 1, 'onboarding': 1,
            'dashboard': 1, 'account': 1
          };
          var RESERVED_SUBS = {
            'admin': 1, 'administrator': 1, 'analytics': 1, 'api': 1, 'app': 1,
            'about': 1, 'account': 1, 'accounts': 1, 'auth': 1, 'billing': 1,
            'blog': 1, 'checkout': 1, 'clerk': 1, 'contact': 1, 'dashboard': 1,
            'demo': 1, 'dev': 1, 'developer': 1, 'discover': 1, 'docs': 1,
            'explore': 1, 'help': 1, 'home': 1, 'iveo': 1, 'ivio': 1,
            'legal': 1, 'login': 1, 'logout': 1, 'mail': 1, 'onboarding': 1,
            'pay': 1, 'pricing': 1, 'privacy': 1, 'root': 1, 'settings': 1,
            'signin': 1, 'signout': 1, 'signup': 1, 'sso-callback': 1,
            'ssocallback': 1, 'staging': 1, 'status': 1, 'supabase': 1,
            'support': 1, 'terms': 1, 'test': 1, 'user': 1, 'users': 1,
            'vercel': 1, 'verify': 1, 'webhook': 1, 'webhooks': 1, 'www': 1,
            'null': 1, 'undefined': 1
          };
          var cleanPath = (window.location.pathname || '/').replace(/^\/+|\/+$/g, '');
          var firstSeg = (cleanPath.split('/')[0] || '').toLowerCase();
          var host = (window.location.hostname || '').toLowerCase().split(':')[0];
          var params = new URLSearchParams(window.location.search);

          var isUserSub = false;
          if (host.endsWith('.iveo.site')) {
            var s1 = host.slice(0, -10);
            if (s1 && !RESERVED_SUBS[s1]) isUserSub = true;
          } else if (host.endsWith('.localhost')) {
            var s2 = host.slice(0, -10);
            if (s2 && !RESERVED_SUBS[s2]) isUserSub = true;
          } else if (host.indexOf('.run.app') !== -1 && host.indexOf('---') !== -1) {
            var s3 = host.split('---')[0];
            if (s3 && !RESERVED_SUBS[s3]) isUserSub = true;
          }
          if (!firstSeg && params.get('subdomain')) {
            var sp = params.get('subdomain').toLowerCase().trim();
            if (sp && !RESERVED_SUBS[sp]) isUserSub = true;
          }

          var isUserPage = isUserSub || (firstSeg !== '' && !SITE_ROUTES[firstSeg]);
          var forceIntro = params.has('intro') || params.has('replay-intro');
          var alreadySeen = localStorage.getItem('iveo-intro-seen') === '1' || sessionStorage.getItem('iveo-intro-seen') === '1';

          if (isUserPage || (!forceIntro && alreadySeen)) {
            var el = document.getElementById('iveo-intro');
            if (el) el.remove();
          } else {
            document.documentElement.classList.add('iveo-intro-active');
          }
        } catch (e) {
          document.documentElement.classList.add('iveo-intro-active');
        }
      })();
    </script>

    <!-- ═══════════════════════════════════════════════════════════════
         iveo Intro Controller: smooth progress, auto curtain lift, persistence
         ═══════════════════════════════════════════════════════════════ -->
    <script id="iveo-intro-js">
      (function () {
        var root = document.getElementById('iveo-intro');
        if (!root) return;

        var CONFIG = {
          duration: 1150,        // fast crisp intro before curtain lifts
          maxWait: 2400          // fail-safe: site always opens quickly
        };

        var html = document.documentElement;
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var bar = root.querySelector('.iv-bar i');
        var count = root.querySelector('.iv-count');
        var leaving = false, start = performance.now();
        var total = reduced ? 300 : CONFIG.duration;

        function tick(now) {
          if (leaving) return;
          var t = Math.min((now - start) / Math.max(150, total - 200), 1);
          var e = 1 - Math.pow(1 - t, 3);
          if (bar) bar.style.transform = 'scaleX(' + e + ')';
          if (count) count.textContent = String(Math.round(e * 100)).padStart(3, '0');
          if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        function finish() {
          if (!root.parentNode) return;
          root.remove();
          html.classList.remove('iveo-intro-active');
          try {
            localStorage.setItem('iveo-intro-seen', '1');
            sessionStorage.setItem('iveo-intro-seen', '1');
          } catch (e) {}
          window.dispatchEvent(new CustomEvent('iveo:intro:done'));
        }

        function leave() {
          if (leaving) return;
          leaving = true;
          if (bar) bar.style.transform = 'scaleX(1)';
          if (count) count.textContent = '100';
          root.classList.add('is-leaving');
          root.addEventListener('animationend', function h(e) {
            if (e.target !== root) return;
            root.removeEventListener('animationend', h);
            finish();
          });
          setTimeout(finish, 700);
        }

        root.addEventListener('click', leave, { once: true });

        var minTime = new Promise(function (r) { setTimeout(r, total); });
        var loaded = new Promise(function (r) {
          if (document.readyState === 'complete' || document.readyState === 'interactive') r();
          else window.addEventListener('DOMContentLoaded', r, { once: true });
        });
        Promise.all([minTime, loaded]).then(leave);
        setTimeout(leave, CONFIG.maxWait);
      })();
    </script>
