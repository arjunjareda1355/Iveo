<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ivio: one link for everything you make</title>
    <meta name="description" content="ivio gives you one calm, customizable page for all your links. Claim your name, pick a vibe and share it anywhere. Free to start." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAFAFA" />
    <link rel="canonical" href="https://ivio.site/" />

    <!-- Favicon: rounded square with white "i" dot and stem -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%230A0A0A'/%3E%3Ccircle cx='12' cy='7.25' r='1.75' fill='%23FFFFFF'/%3E%3Crect x='10.5' y='10.5' width='3' height='8' rx='1.5' fill='%23FFFFFF'/%3E%3C/svg%3E" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ivio" />
    <meta property="og:title" content="ivio: one link for everything you make" />
    <meta property="og:description" content="ivio gives you one calm, customizable page for all your links. Claim your name, pick a vibe and share it anywhere. Free to start." />
    <meta property="og:url" content="https://ivio.site/" />
    <!-- og:image: 1200x630 social share preview image still needs to be produced for production launch -->
    <meta property="og:image" content="https://ivio.site/og.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ivio: one link for everything you make" />
    <meta name="twitter:description" content="ivio gives you one calm, customizable page for all your links. Claim your name, pick a vibe and share it anywhere. Free to start." />
    <meta name="twitter:image" content="https://ivio.site/og.png" />

    <!-- Google Fonts with preconnect and display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD): Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ivio",
        "url": "https://ivio.site",
        "email": "help@ivio.site",
        "description": "One calm home for your links."
      }
    </script>

    <!-- Structured Data (JSON-LD): FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is ivio free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The free plan includes one page, unlimited links and all six vibes. Pro adds link scheduling, password-protected links, advanced analytics and contact collection."
            }
          },
          {
            "@type": "Question",
            "name": "Can I change my username later?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, from Settings. Your old address stops working when you change it, so update it anywhere you have shared it."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use my own domain?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Custom domains are on our roadmap. For now, every page lives at ivio.site/yourname."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a website to use ivio?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. ivio works on its own. Many people use it as their only page, and others link to it from social profiles, email signatures and printed materials."
            }
          },
          {
            "@type": "Question",
            "name": "What does analytics show?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Page views, link clicks, click-through rate, top referrers and device types. We do not sell visitor data, and we do not collect visitor names or emails unless you add a signup block."
            }
          },
          {
            "@type": "Question",
            "name": "Can I collect emails from visitors?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. With Pro you can add a signup block for emails or phone numbers and export everything as a CSV file whenever you like."
            }
          },
          {
            "@type": "Question",
            "name": "What happens if I cancel Pro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your page stays online on the free plan. Pro-only blocks are hidden, not deleted, so they return if you upgrade again."
            }
          },
          {
            "@type": "Question",
            "name": "How do I get help?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Email help@ivio.site. We read every message and aim to reply within one to two business days."
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-bg text-ink antialiased selection:bg-ink selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
